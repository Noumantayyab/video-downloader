<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enhanced Luxury Palette Explorer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { font-family: sans-serif; max-width: 1000px; margin: 2em auto; text-align: center; }
    h1, h2 { margin-bottom: 1em; }
    .controls { display: flex; justify-content: center; gap: 0.5em; flex-wrap: wrap; margin-bottom: 1em; }
    .controls > * { flex: 1 1 auto; min-width: 120px; }
    #palette { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 0.5em; margin-bottom: 2em; }
    #explorePalettes { margin-bottom: 1em; }
    .palette-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5em; margin-bottom: 1em; }
    .swatch { position: relative; padding-top: 100%; cursor: pointer; border-radius: 4px; overflow: hidden; transition: transform 0.2s; }
    .swatch:hover { transform: scale(1.05); }
    .swatch .color { position: absolute; inset: 0; }
    .swatch .label {
      position: absolute; bottom: 0; left: 0; right: 0;
      text-align: center; font-size: 0.9em; background: rgba(255,255,255,0.8);
      padding: 0.2em; backdrop-filter: blur(4px);
    }
    button, input, select { padding: 0.5em 1em; font-size: 1em; border-radius: 4px; border: 1px solid #ccc; }
    button { background: #222; color: #fff; border: none; cursor: pointer; }
    button:hover { background: #444; }
    #loadMoreBtn { margin: 1em 0 2em; }
    #copiedMsg {
      position: fixed; bottom: 1em; left: 50%; transform: translateX(-50%);
      background: #333; color: #fff; padding: 0.5em 1em; border-radius: 4px; display: none;
    }
  </style>
</head>
<body>
  <h1>Enhanced Luxury Palette Explorer</h1>

  <div class="controls">
    <input type="color" id="baseColor" value="#4a7a6f" />
    <input type="text" id="baseHex" value="#4a7a6f" maxlength="7" />
    <select id="harmony">
      <option value="monochrome">Monochrome</option>
      <option value="complementary" selected>Complementary</option>
      <option value="analogous">Analogous</option>
      <option value="triadic">Triadic</option>
      <option value="split">Split-Complementary</option>
      <option value="tetradic">Tetradic</option>
    </select>
    <button id="generateBtn">Generate Palette</button>
  </div>

  <div id="palette"></div>

  <h2>Explore from Local colors.json</h2>
  <div id="explorePalettes"></div>
  <button id="loadMoreBtn">Load More Colors</button>

  <div id="copiedMsg">Copied!</div>

  <script>
    // --- Sync inputs ---
    const colorInput = document.getElementById('baseColor');
    const hexInput = document.getElementById('baseHex');
    colorInput.oninput = () => hexInput.value = colorInput.value;
    hexInput.oninput = () => { if (/^#[0-9A-Fa-f]{6}$/.test(hexInput.value)) colorInput.value = hexInput.value; };

    // --- Color conversion ---
    function hexToHSL(H) {
      let r,g,b;
      if (H.length === 4) [r,g,b] = H.slice(1).split('').map(c=>parseInt(c+c,16));
      else [r,g,b] = [H.slice(1,3),H.slice(3,5),H.slice(5,7)].map(c=>parseInt(c,16));
      [r,g,b] = [r/255,g/255,b/255];
      const cmin = Math.min(r,g,b), cmax = Math.max(r,g,b), delta = cmax-cmin;
      let h=0, s=0, l=(cmax+cmin)/2;
      if(delta){ s = delta/(1-Math.abs(2*l-1));
        switch(cmax){ case r: h=((g-b)/delta)%6; break; case g: h=(b-r)/delta+2; break; case b: h=(r-g)/delta+4; break; }
        h = (Math.round(h*60)+360)%360;
      }
      return {h,s,l};
    }
    function HSLToHex(h,s,l){ s=Math.max(0,Math.min(s,1)); l=Math.max(0,Math.min(l,1));
      const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
      let [r,g,b] =
        h<60 ? [c,x,0] :
        h<120 ? [x,c,0] :
        h<180 ? [0,c,x] :
        h<240 ? [0,x,c] :
        h<300 ? [x,0,c] : [c,0,x];
      return '#'+[r,g,b].map(v=>Math.round((v+m)*255).toString(16).padStart(2,'0')).join('');
    }

    // --- Custom palette generation ---
    function generateHarmony({h,s,l}, type) {
      const schemes = { complementary:[0,180], analogous:[0,-30,30], triadic:[0,120,240], split:[0,150,210], tetradic:[0,90,180,270], monochrome:[0] };
      return (schemes[type]||[0]).map(a => HSLToHex((h+a+360)%360, s, l));
    }
    function generatePalette(base, type){
      const hsl = hexToHSL(base);
      let pal = generateHarmony(hsl, type);
      while(pal.length<5) pal.push(HSLToHex(hsl.h, hsl.s, hsl.l + (pal.length-2)*0.1));
      return pal.slice(0,5);
    }

    // --- Swatch rendering ---
    function copyColor(){
      navigator.clipboard.writeText(this.dataset.color).then(()=>{
        const m=document.getElementById('copiedMsg'); m.style.display='block';
        setTimeout(()=>m.style.display='none',1000);
      });
    }
    function renderSwatches(container, colors){
      colors.forEach(c=>{
        const d=document.createElement('div');
        d.className='swatch'; d.dataset.color=c;
        d.innerHTML = `<div class="color" style="background:${c}"></div><div class="label">${c}</div>`;
        d.addEventListener('click', copyColor);
        container.appendChild(d);
      });
    }

    // --- Main palette init ---
    document.getElementById('generateBtn').addEventListener('click', ()=>{
      const pal = generatePalette(hexInput.value, document.getElementById('harmony').value);
      const cont = document.getElementById('palette'); cont.innerHTML=''; renderSwatches(cont, pal);
    });
    document.getElementById('generateBtn').click();

    // --- Explore using colors.json ---
    let flatColors = [];
    let idx = 0, batch = 20;
    const exploreCont = document.getElementById('explorePalettes');
    async function loadColorsJSON(){
      try {
        const res = await fetch('static/colors.json');
        const data = await res.json();
        // Flatten hex codes from root and children
        data.forEach(item => {
          if(item.hex) flatColors.push(item.hex);
          if(Array.isArray(item.children)) item.children.forEach(ch => ch.hex && flatColors.push(ch.hex));
        });
        renderMore();
      } catch(err) { console.error('Error loading colors.json', err); }
    }
    function renderMore(){
      const slice = flatColors.slice(idx, idx+batch);
      if(!slice.length){ document.getElementById('loadMoreBtn').style.display='none'; return; }
      const row = document.createElement('div'); row.className='palette-row';
      renderSwatches(row, slice);
      exploreCont.appendChild(row);
      idx += batch;
    }
    document.getElementById('loadMoreBtn').addEventListener('click', renderMore);
    // Initial load
    loadColorsJSON();
  </script>
</body>
</html>
